# Fly.io deployment.
#
# One machine, one volume. Node's SQLite is single-process and the rate limiter
# and cache are in-process, so this deliberately does not autoscale — see
# docs/operations/deployment.md.
#
# Before the first deploy:
#   fly launch --no-deploy --copy-config
#   fly volumes create auralis_data --size 1
#   fly secrets set AURALIS_SECRET_KEY="$(openssl rand -base64 32)" \
#                   AURALIS_SESSION_SECRET="$(openssl rand -hex 32)"
#   fly deploy

app = "auralis"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  AURALIS_PORT = "8080"
  AURALIS_HOST = "0.0.0.0"
  AURALIS_SERVE_WEB = "true"
  AURALIS_WEB_DIST = "packages/web/dist"
  AURALIS_DATABASE_PATH = "/data/auralis.db"
  AURALIS_LOG_LEVEL = "info"

[[mounts]]
  source = "auralis_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One instance. Raising this splits the database and the rate limiter.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
